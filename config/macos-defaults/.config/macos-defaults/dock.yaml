description: Dock
kill: ["Dock"]
data:
  com.apple.dock:
    orientation: right
    # Icon size
    tilesize: 52.0
    autohide: true
    autohide-time-modifier: 0
    # NEW: no delay before the Dock slides in
    autohide-delay: 0.0
    # NEW: scale (not genie) minimize effect; skip the app-launch bounce
    mineffect: scale
    launchanim: false
    # NEW: near-instant Mission Control; 0 gets ignored, so use a tiny value
    expose-animation-duration: 0.1
    # Wipe all pinned apps (no "..." means this array replaces, not merges)
    persistent-apps: []
    # Only show running apps
    static-only: true
    # Show hidden apps as translucent
    showhidden: true
    minimize-to-application: true
    no-bouncing: false
    # NEW: don't reorder Spaces by recent use — keeps Aerospace workspaces stable
    mru-spaces: false
    # NEW: hide recent apps in the Dock
    show-recents: false
