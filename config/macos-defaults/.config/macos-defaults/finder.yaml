description: Finder & save/print dialogs
kill: ["Finder"]
data:
  com.apple.finder:
    # New windows open to home
    NewWindowTarget: PfHm
    ShowHardDrivesOnDesktop: false
    ShowRecentTags: false
    # NEW: hide all icons on the desktop
    CreateDesktop: false
    # Keep hidden files hidden (toggle with Cmd-Shift-.)
    AppleShowAllFiles: false
    # List view; search the current folder by default
    FXPreferredViewStyle: Nlsv
    FXDefaultSearchScope: SCcf
    FXEnableExtensionChangeWarning: false
    ShowPathbar: true
    ShowStatusBar: true
    _FXShowPosixPathInTitle: true
    # NEW: keep folders on top when sorting by name
    _FXSortFoldersFirst: true
    OpenWindowForNewRemovableDisk: true
  com.apple.desktopservices:
    DSDontWriteUSBStores: true
    # NEW: also skip .DS_Store on network shares
    DSDontWriteNetworkStores: true
  # Auto-open a Finder window when mounting a new disk image
  com.apple.frameworks.diskimages:
    auto-open-ro-root: true
    auto-open-rw-root: true
  NSGlobalDomain:
    # Show all file extensions
    AppleShowAllExtensions: true
    # Expand save & print panels by default
    NSNavPanelExpandedStateForSaveMode: true
    NSNavPanelExpandedStateForSaveMode2: true
    PMPrintingExpandedStateForPrint: true
    # Save new documents to disk (not iCloud) by default
    NSDocumentSaveNewDocumentsToCloud: false
