description: Miscellaneous system behavior
kill: ["SystemUIServer"]
data:
  NSGlobalDomain:
    # Disable Resume system-wide (don't reopen windows on relaunch)
    NSQuitAlwaysKeepsWindows: false
    # No UI beep on system alerts
    com.apple.sound.beep.feedback: 0
  com.apple.TimeMachine:
    # Don't prompt to use new disks as a backup volume
    DoNotOfferNewDisksForBackup: true
  com.apple.loginwindow:
    # Don't relaunch apps that were open at logout/restart
    TALLogoutSavesState: false
    LoginwindowLaunchesRelaunchApps: false
  com.apple.BezelServices:
    # Don't auto-adjust display brightness to ambient light. On recent hardware
    # this may be ignored (the ambient-light sensor moved); verify in Settings.
    dAuto: false
