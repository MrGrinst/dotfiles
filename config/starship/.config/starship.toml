# Pure-style prompt, close to the old oh-my-zsh "refined" theme.
format = """
$username$hostname$directory$git_branch$git_status$git_state$cmd_duration
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[git:$branch]($style)"
style = "bright-black"

[git_status]
format = "[(*$conflicted$modified$staged$renamed$deleted)]($style)"
style = "bright-black"
conflicted = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
